<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Truples iOS 원클릭 설치</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #030718;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 40px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(59, 130, 246, 0.15);
      backdrop-filter: blur(20px);
    }
    .app-icon {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      margin: 0 auto 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: block;
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; color: #ffffff; }
    p.subtitle { font-size: 14px; color: #94a3b8; margin-bottom: 28px; line-height: 1.5; }
    .btn-install {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: #ffffff;
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      padding: 16px 20px;
      border-radius: 16px;
      box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.5);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-install:active { transform: scale(0.98); opacity: 0.9; }
    .guide {
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
      text-align: left;
      background: rgba(0, 0, 0, 0.25);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .guide strong { color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="Truples" class="app-icon" onerror="this.src='/favicon.ico'">
    <h1>Truples iOS</h1>
    <p class="subtitle">Ad-Hoc 직통 무설치 패키지<br>Apple PushKit VoIP & 실시간 통화 지원</p>
    
    <a href="itms-services://?action=download-manifest&url=https://truples.com/ios/manifest.plist" class="btn-install" id="installBtn">
      📲 아이폰에 즉시 설치
    </a>

    <div class="guide">
      <strong>💡 설치 후 안내:</strong><br>
      1. 버튼 클릭 시 <strong>"설치하시겠습니까?"</strong> 팝업이 뜨면 [설치]를 누르세요.<br>
      2. 홈 화면으로 이동하면 앱이 3초 만에 다운로드됩니다.<br>
      3. 첫 실행 시 <strong>[설정 > 일반 > VPN 및 기기 관리]</strong>에서 개발자 인증서를 신뢰해 주세요.
    </div>
  </div>

  <script>
    document.getElementById('installBtn').addEventListener('click', function() {
      setTimeout(function() {
        alert('홈 화면으로 나가시면 Truples 앱이 설치되고 있습니다!');
      }, 1000);
    });
  </script>
</body>
</html>
