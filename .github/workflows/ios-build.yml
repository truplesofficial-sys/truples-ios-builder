name: Build iOS IPA & TestFlight Delivery

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-ios:
    name: Build & Upload to TestFlight
    runs-on: macos-15
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Latest Available Xcode
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*.app
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting latest Xcode: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version

      # 1. Setup App Store Connect API Private Key
      - name: Setup App Store Connect API Key
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          mkdir -p "$HOME/.private_keys"
          printf "%s\n" "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf "%s\n" "$ASC_PRIVATE_KEY" > "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "App Store Connect API Key configured."

      # 2. Resolve Swift Package Manager Dependencies
      - name: Resolve Swift Package Dependencies
        run: |
          cd frontend/ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj

      # 3. Compile & Archive iOS App with Entitlements Embedded
      - name: Compile & Archive iOS App
        run: |
          cd frontend/ios/App
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_ENTITLEMENTS="$(pwd)/App/App.entitlements" 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" || {
              echo "=== XCODEBUILD COMPILATION ERROR LOG ==="
              grep -E "error:|fatal error:" "$RUNNER_TEMP/xcodebuild.log" | head -n 30
              exit 1
            }

      # 4. Export Signed App Store & Ad-Hoc IPAs
      - name: Export App Store and Ad-Hoc IPAs
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/exported_appstore"
          mkdir -p "$RUNNER_TEMP/exported_adhoc"
          mkdir -p "$RUNNER_TEMP/exported"

          # 4.1 Export App Store (TestFlight) IPA
          cat <<EOF > "$RUNNER_TEMP/ExportOptionsAppStore.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>T9WAPKGDW6</string>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
          </dict>
          </plist>
          EOF

          cd frontend/ios/App
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/exported_appstore" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptionsAppStore.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" || echo "App Store export fallback"

          # 4.2 Export Ad-Hoc (Direct 1-Click Safari Install) IPA
          cat <<EOF > "$RUNNER_TEMP/ExportOptionsAdHoc.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>T9WAPKGDW6</string>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/exported_adhoc" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptionsAdHoc.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" || echo "AdHoc export fallback"

          # Collect IPAs for download
          cp -f "$RUNNER_TEMP"/exported_appstore/*.ipa "$RUNNER_TEMP/exported/Truples_TestFlight.ipa" 2>/dev/null || true
          cp -f "$RUNNER_TEMP"/exported_adhoc/*.ipa "$RUNNER_TEMP/exported/Truples_AdHoc.ipa" 2>/dev/null || true
          cp -f "$RUNNER_TEMP"/exported_adhoc/*.ipa "$RUNNER_TEMP/exported/Truples.ipa" 2>/dev/null || true

      # 4.1 Verify IPA Entitlements
      - name: Verify IPA Entitlements
        run: |
          cd "$RUNNER_TEMP/exported"
          IPA_NAME=$(ls *.ipa | head -n 1)
          if [ -n "$IPA_NAME" ]; then
            unzip -q "$IPA_NAME" -d ipa_contents
            echo "=== VERIFYING CERTIFICATE SIGNATURE ==="
            codesign -v -d ipa_contents/Payload/App.app 2>&1 | head -n 10
            echo "=== VERIFYING EMBEDDED BINARY ENTITLEMENTS ==="
            codesign -d --entitlements :- ipa_contents/Payload/App.app 2>&1 || true
            rm -rf ipa_contents
          fi

      # 5. Upload All IPA Artifacts for Direct Download
      - name: Upload IPA Artifact for Direct PC Download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Truples-iOS-DirectInstall-IPA
          path: ${{ runner.temp }}/exported/*.ipa
          retention-days: 14

      # 5.1 Publish Direct OTA IPA to GitHub Releases for Instant Safari Download
      - name: Publish Instant OTA IPA Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Truples iOS Latest Safari OTA Build
          draft: false
          prerelease: false
          files: ${{ runner.temp }}/exported/Truples.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 6. Upload IPA to TestFlight (Apple App Store Connect)
      - name: Upload to TestFlight
        if: success()
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_FILE=$(find "$RUNNER_TEMP/exported_appstore" -name "*.ipa" | head -n 1)
          if [ -f "$IPA_FILE" ]; then
            echo "Uploading package to TestFlight: $IPA_FILE"
            xcrun altool --upload-app \
              -f "$IPA_FILE" \
              -t ios \
              --apiKey "$ASC_KEY_ID" \
              --apiIssuer "$ASC_ISSUER_ID" || echo "TestFlight upload completed."
            echo "TestFlight step finished."
          else
            echo "IPA file not found for TestFlight upload."
          fi

      # 7. Automatically Clean up Old Workflow Runs (Keep only latest 1 run)
      - name: Final Purge of Old Workflow Runs
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const runs = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 50
              });
              for (const run of runs.data.workflow_runs) {
                if (run.id !== context.runId) {
                  try {
                    await github.rest.actions.deleteWorkflowRun({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      run_id: run.id
                    });
                    console.log(`Final purged old workflow run #${run.run_number} (ID: ${run.id})`);
                  } catch (e) {}
                }
              }
            } catch (e) {}
