name: Build iOS IPA & TestFlight
run-name: "🍏 [TestFlight] ${{ github.event.head_commit.message || 'Manual Trigger' }}"

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build & Upload to TestFlight
    runs-on: macos-15
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Latest Available Xcode
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*.app
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting latest Xcode: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version

      # 1. Setup App Store Connect API Private Key
      - name: Setup App Store Connect API Key
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          mkdir -p "$HOME/.private_keys"
          printf "%s\n" "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf "%s\n" "$ASC_PRIVATE_KEY" > "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "App Store Connect API Key configured."

      # 2. Resolve Swift Package Manager Dependencies
      - name: Resolve Swift Package Dependencies
        run: |
          cd frontend/ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj

      # 3. Compile & Archive iOS App with Entitlements Embedded
      - name: Compile & Archive iOS App
        run: |
          cd frontend/ios/App
          set -o pipefail
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_ENTITLEMENTS="$(pwd)/App/App.entitlements" 2>&1 | tee xcodebuild_archive.log || {
              echo "### ❌ Xcode Build Failed" >> $GITHUB_STEP_SUMMARY
              echo '```text' >> $GITHUB_STEP_SUMMARY
              tail -n 100 xcodebuild_archive.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "=== ARCHIVE FAILED - LAST 200 LINES ==="
              tail -n 200 xcodebuild_archive.log
              exit 1
            }

      - name: Upload Xcode Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild_archive_log
          path: frontend/ios/App/xcodebuild_archive.log

      # 4. Export Signed App Store IPA with Cloud Signing
      - name: Export App Store IPA
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          cat <<EOF > "$RUNNER_TEMP/ExportOptions.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>T9WAPKGDW6</string>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
          </dict>
          </plist>
          EOF

          mkdir -p "$RUNNER_TEMP/exported"
          cd frontend/ios/App
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/exported" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log" || {
              echo "=== XCODEBUILD EXPORT ERROR LOG ==="
              cat "$RUNNER_TEMP/export.log"
              exit 1
            }

      # 4.1 Verify IPA Entitlements
      - name: Verify IPA Entitlements
        run: |
          cd "$RUNNER_TEMP/exported"
          IPA_NAME=$(ls *.ipa 2>/dev/null | head -n 1)
          if [ -n "$IPA_NAME" ]; then
            unzip -q "$IPA_NAME" -d ipa_contents
            echo "=== VERIFYING CERTIFICATE SIGNATURE ==="
            codesign -v -d ipa_contents/Payload/App.app 2>&1 | head -n 10
            echo "=== VERIFYING EMBEDDED BINARY ENTITLEMENTS ==="
            codesign -d --entitlements :- ipa_contents/Payload/App.app 2>&1 || true
            rm -rf ipa_contents
          fi

      # 6. Upload IPA to TestFlight (Apple App Store Connect)
      - name: Upload to TestFlight
        if: success()
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_FILE=$(find "$RUNNER_TEMP/exported" -name "*.ipa" | head -n 1)
          if [ -f "$IPA_FILE" ]; then
            echo "Uploading package to TestFlight: $IPA_FILE"
            xcrun altool --upload-app \
              -f "$IPA_FILE" \
              -t ios \
              --apiKey "$ASC_KEY_ID" \
              --apiIssuer "$ASC_ISSUER_ID"
            echo "TestFlight upload completed successfully."
          else
            echo "❌ IPA file not found for TestFlight upload."
            ls -la "$RUNNER_TEMP/exported" || true
            exit 1
          fi

      # 7. Automatically Clean up Old Workflow Runs (Keep only latest 1 run)
      - name: Final Purge of Old Workflow Runs
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const runs = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 50
              });
              for (const run of runs.data.workflow_runs) {
                if (run.id !== context.runId && run.status === 'completed') {
                  try {
                    await github.rest.actions.deleteWorkflowRun({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      run_id: run.id
                    });
                    console.log(`Final purged old workflow run #${run.run_number} (ID: ${run.id})`);
                  } catch (e) {}
                }
              }
            } catch (e) {}
